name: Threads 자동 게시

on:
  schedule:
    # GitHub starts scheduled runs 20~50 minutes late, worst on the hour, so these are set early and off the hour.
    - cron: "37 22 * * 0-4"  # 장 전: 한국 시간 월~금 07:37 예약 (실제 게시 08시 전후)
    - cron: "37 2 * * 1-5"   # 점심 장중: 한국 시간 월~금 11:37 예약 (12시 전후)
    - cron: "47 6 * * 1-5"   # 장 마감: 한국 시간 월~금 15:47 예약 (장 끝난 15:30 이후, 16시 전후)
    - cron: "37 12 * * 1-5"  # 밤 미장: 한국 시간 월~금 21:37 예약 (22시 전후)
  workflow_dispatch:
    inputs:
      slot:
        description: "어떤 글을 만들까요?"
        type: choice
        options: [close, lunch, morning, evening]
        default: close
      force:
        description: "휴장일 검사 건너뛰기"
        type: boolean
        default: false

permissions:
  contents: write

# No workflow-level concurrency: a publish job waiting for approval must not block the next slot.
# Only the draft job is serialized, so two runs never push to main at the same time.
jobs:
  draft:
    runs-on: ubuntu-latest
    concurrency:
      group: threads-draft
      cancel-in-progress: false
    outputs:
      skip: ${{ steps.draft.outputs.skip }}
      dir: ${{ steps.draft.outputs.dir }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: 초안 만들기
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          SLOT_INPUT: ${{ inputs.slot }}
          FORCE: ${{ inputs.force }}
        run: |
          slot="$SLOT_INPUT"
          if [ -z "$slot" ]; then
            case "$SCHEDULE" in
              # The older on-the-hour strings stay so a run queued before the schedule change still maps right.
              "37 22 * * 0-4"|"0 23 * * 0-4") slot=morning ;;
              "37 2 * * 1-5"|"0 3 * * 1-5") slot=lunch ;;
              "47 6 * * 1-5"|"0 7 * * 1-5") slot=close ;;
              "37 12 * * 1-5"|"0 13 * * 1-5") slot=evening ;;
              *) echo "알 수 없는 예약 시간: $SCHEDULE"; exit 1 ;;
            esac
          fi
          extra=""
          if [ "$FORCE" = "true" ]; then extra="--force"; fi
          python -m bot.main draft --slot "$slot" $extra
      - name: 이미지 공개용으로 커밋
        id: commit
        if: steps.draft.outputs.skip == 'false'
        env:
          DIR: ${{ steps.draft.outputs.dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          git commit -m "draft: $DIR"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "![card](https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)/$DIR/card.png)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: draft
    if: needs.draft.outputs.skip == 'false'
    runs-on: ubuntu-latest
    # 저장소 Settings → Environments → threads 에서 "Required reviewers"를 켜면 승인 후에만 이 단계가 실행돼요.
    environment: threads
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Threads에 게시
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: >
          python -m bot.main publish
          --draft "${{ needs.draft.outputs.dir }}"
          --image-base "https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.draft.outputs.sha }}"
